# Orquestación del Asistente de Empleabilidad IA — scaffold end-to-end.
# Todo corre en contenedores; el host no necesita .NET SDK, Python ni node instalados.
# Levantar:  docker compose up --build
# Verificar: /health de cada servicio.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empleo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empleo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-empleabilidad}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empleo} -d ${POSTGRES_DB:-empleabilidad}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Cadena de conexión a PostgreSQL (usada por EP-001 provisión + EP-002).
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-empleabilidad};Username=${POSTGRES_USER:-empleo};Password=${POSTGRES_PASSWORD:-empleo_dev}"
      ATS_SERVICE_URL: "http://ats-service:8000"
      # Clave de firma JWT server-side (EP-001, design D4). Dev por defecto; en
      # producción se inyecta por entorno seguro y NUNCA llega al frontend.
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev-signing-key-cambiar-en-produccion-000000000000000000000000}"
      # LinkedIn OAuth2 (mock-first): sin estas variables se usa FakeLinkedInClient.
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      LinkedIn__RedirectUri: "${LINKEDIN_REDIRECT_URI:-http://localhost:8080/auth/linkedin/callback}"
      # Origen del SPA al que vuelve el usuario tras el callback OAuth2 (HU-001).
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ats-service:
    build: ./ats-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: "http://localhost:8080"
    ports:
      - "5173:5173"
    # Código fuente montado para que el HMR de Vite recoja los cambios del host sin
    # reconstruir la imagen (el host no tiene toolchain de Node: sigue siendo el
    # contenedor quien compila). Solo lectura: el contenedor nunca escribe fuentes.
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    depends_on:
      - backend

volumes:
  db_data:
